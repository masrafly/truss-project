name: CI

on:
  push:
    branches: [main]
  pull_request:

# Hak minimum: CI hanya perlu membaca kode.
permissions:
  contents: read

# Push baru ke branch yang sama membatalkan run lama yang belum selesai.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, vet, build, test (PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          # Kredensial sekali pakai untuk container test di CI, bukan kredensial asli.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: truss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d truss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: truss_test
      TEST_DB_SSLMODE: disable
      # Integration test GAGAL (bukan skip) bila database tidak tersedia.
      TEST_DB_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cek format (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "File berikut belum di-gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verifikasi dependensi
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race hanya tersedia dengan cgo (ada di runner Linux, tidak di mesin Windows lokal).
      - name: Test (unit + integration, race detector)
        run: go test -race -count=1 -timeout 5m ./...

  vulncheck:
    name: Cek kerentanan dependensi (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Dipasang langsung (bukan lewat govulncheck-action) agar versi Go selalu dari go.mod
      # dan tidak ada input go-version ganda. Database kerentanan selalu yang terbaru.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    name: Build image dan smoke test (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Memverifikasi Dockerfile: build multi-stage, lalu image dijalankan bersama PostgreSQL 18
      # (HEALTHCHECK, alur API nyata, non-root, shutdown rapi). Lihat scripts/docker-smoke.sh.
      - name: Build image
        run: docker build -t truss-api:smoke .

      - name: Smoke test image
        run: bash scripts/docker-smoke.sh truss-api:smoke

  compose:
    name: docker compose (API + PostgreSQL + migration)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Menjalankan docker-compose.yml sungguhan: migration, API, volume PostgreSQL 18 yang bertahan
      # setelah down/up, port loopback, dan shutdown rapi. Lihat scripts/compose-smoke.sh.
      - name: Smoke test docker compose
        run: bash scripts/compose-smoke.sh
